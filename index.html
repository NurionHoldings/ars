<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#193C64">
  <title>보이는 ARS</title>
  <link rel="icon" href="logo.png">
  <style>
    :root {
      --navy: #193C64; --navy-2: #24548a; --gold: #f2b84b; --tint: #e8f0fa; --tint-line: #c9d9ee;
      --bg: #dfe7f1; --text: #13202f; --sub: #4a5869;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--text);
      font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif; -webkit-text-size-adjust: 100%; }
    header { background: linear-gradient(180deg, #0f2a4a 0%, var(--navy) 100%); color: #fff; padding: 26px 20px 30px; text-align: center; }
    header img { display: block; width: 240px; max-width: 75%; height: auto; margin: 0 auto; }
    header h1 { margin: 14px 0 10px; font-size: 30px; font-weight: 800; letter-spacing: -0.5px; }
    header p { margin: 0; font-size: 18px; line-height: 1.55; color: #dce8f7; white-space: pre-line; }
    main { padding: 18px 14px 120px; max-width: 520px; margin: 0 auto; }
    .label { font-size: 15px; font-weight: 600; color: var(--navy); margin: 2px 4px 12px; }
    .item { background: var(--tint); border: 1px solid var(--tint-line); border-radius: 16px; margin-bottom: 14px; overflow: hidden;
      box-shadow: 0 2px 6px rgba(25, 60, 100, .12); }
    .item > button { width: 100%; display: flex; align-items: center; gap: 14px; padding: 18px 16px; border: 0;
      background: linear-gradient(135deg, var(--navy) 0%, var(--navy-2) 100%); font: inherit; font-size: 22px; font-weight: 700;
      color: #fff; text-align: left; cursor: pointer; }
    .item > button:active { filter: brightness(1.15); }
    .num { flex: none; width: 40px; height: 40px; border-radius: 50%; background: var(--gold); color: var(--navy);
      display: grid; place-items: center; font-size: 20px; font-weight: 800; }
    .chev { margin-left: auto; color: #cfe0f5; font-size: 26px; transition: transform .2s; }
    .item.open .chev { transform: rotate(90deg); }
    .detail { display: none; padding: 16px 18px 18px 72px; }
    .item.open .detail { display: block; }
    .detail p { margin: 0 0 12px; font-size: 19px; line-height: 1.6; white-space: pre-line; }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; }
    .actions a { display: inline-block; padding: 12px 16px; border-radius: 12px; border: 2px solid var(--navy); background: #fff;
      color: var(--navy); text-decoration: none; font-size: 17px; font-weight: 700; }
    .actions a.primary { background: var(--navy); color: #fff; }
    .hint { font-size: 16px; color: var(--sub); text-align: center; margin: 18px 4px 0; padding: 14px; line-height: 1.6;
      background: #fff; border-radius: 14px; white-space: pre-line; }
    .call { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 14px calc(12px + env(safe-area-inset-bottom));
      background: rgba(223, 231, 241, .96); border-top: 1px solid var(--tint-line); }
    .call a { display: block; max-width: 520px; margin: 0 auto; padding: 17px; border-radius: 14px; background: var(--gold);
      color: var(--navy); text-align: center; text-decoration: none; font-size: 20px; font-weight: 800; }
    .error { text-align: center; padding: 40px 20px; color: var(--sub); font-size: 17px; }
    /* ?image: every answer expanded, no buttons — rendered into the menu picture sent by MMS */
    body.image main { padding-bottom: 24px; }
    body.image .detail { display: block; }
    body.image .chev, body.image .actions, body.image .label { display: none; }
    body.image .reply { display: inline-block; }
    .reply { display: none; margin-top: 2px; padding: 6px 12px; border-radius: 999px; background: var(--navy); color: #fff;
      font-size: 16px; font-weight: 700; }
  </style>
</head>
<body>
  <header>
    <img src="logo.png" alt="">
    <h1 id="company">보이는 ARS</h1>
    <p id="greeting"></p>
  </header>
  <main>
    <div class="label">메뉴를 누르면 안내가 펼쳐집니다</div>
    <div id="menu"></div>
    <p class="hint" id="hint"></p>
  </main>
  <div class="call" id="call" hidden><a id="callLink" href="#">전화 걸기</a></div>

  <script>
    // iOS separates the body with '&', Android with '?'.
    const smsHref = (phone, body) =>
      `sms:${phone}${/iPhone|iPad|iPod/.test(navigator.userAgent) ? '&' : '?'}body=${encodeURIComponent(body)}`;
    const formatPhone = (p) => p.replace(/^(\d{3})(\d{3,4})(\d{4})$/, '$1-$2-$3');
    const imageMode = new URLSearchParams(location.search).has('image');
    if (imageMode) document.body.classList.add('image');

    function el(tag, props = {}, children = []) {
      const node = Object.assign(document.createElement(tag), props);
      node.append(...children);
      return node;
    }

    function link(text, href, primary) {
      return el('a', { textContent: text, href, className: primary ? 'primary' : '', target: href.startsWith('http') ? '_blank' : '' });
    }

    function render(cfg) {
      document.title = `${cfg.company} 안내`;
      document.getElementById('company').textContent = cfg.company;
      document.getElementById('greeting').textContent = (imageMode && cfg.imageGreeting) || cfg.greeting;
      const menu = document.getElementById('menu');

      for (const item of cfg.items) {
        const actions = [];
        if (item.map) {
          const q = encodeURIComponent(item.map);
          actions.push(link('네이버 지도', `https://map.naver.com/p/search/${q}`), link('카카오맵', `https://map.kakao.com/link/search/${q}`));
        }
        if (item.url) actions.push(link(item.urlLabel || '열기', item.url, true));
        if (item.sms) actions.push(link(item.smsLabel || '문자 보내기', smsHref(cfg.phone, item.sms), true));

        const box = el('div', { className: 'item' });
        const button = el('button', { type: 'button' }, [
          el('span', { className: 'num', textContent: item.key }),
          el('span', { textContent: item.title }),
          el('span', { className: 'chev', textContent: '›', ariaHidden: 'true' }),
        ]);
        button.setAttribute('aria-expanded', 'false');
        button.addEventListener('click', () => {
          const open = !box.classList.contains('open');
          menu.querySelectorAll('.item.open').forEach((o) => { o.classList.remove('open'); o.firstChild.setAttribute('aria-expanded', 'false'); });
          box.classList.toggle('open', open);
          button.setAttribute('aria-expanded', String(open));
        });
        box.append(button, el('div', { className: 'detail' }, [
          el('p', { textContent: (imageMode && item.imageText) || item.text || '' }),
          el('div', { className: 'reply', textContent: `문자로 ${item.key} 답장` }),
          ...(actions.length ? [el('div', { className: 'actions' }, actions)] : []),
        ]));
        menu.append(box);
      }

      document.getElementById('hint').textContent =
        `메뉴 번호만 문자로 답장하셔도\n바로 안내해 드립니다.\n문의 ${formatPhone(cfg.phone)}`;
      if (imageMode) return;
      const call = document.getElementById('callLink');
      call.href = `tel:${cfg.phone}`;
      call.textContent = `전화 걸기 ${formatPhone(cfg.phone)}`;
      document.getElementById('call').hidden = false;
    }

    fetch('config.json', { cache: 'no-cache' })
      .then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(render)
      .catch(() => {
        document.getElementById('menu').replaceWith(el('div', { className: 'error', textContent: '안내를 불러오지 못했습니다. 잠시 후 다시 열어 주세요.' }));
      });
  </script>
</body>
</html>
